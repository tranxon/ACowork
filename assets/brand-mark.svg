<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 96" width="396" height="96" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <defs>
    <linearGradient id="bg" x1="14" y1="2" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#F0A92E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <!-- Apple-style bite: white reveals the dot; black bite circle (offset right, vertically centered) carves the C silhouette that mirrors the wordmark's "Co". -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="40" y="40" width="40" height="40">
      <rect x="40" y="40" width="40" height="40" fill="white"/>
      <circle cx="62" cy="54" r="3.6" fill="black"/>
    </mask>
  </defs>
  <!-- warm yellow icon background -->
  <rect x="14" y="2" width="84" height="84" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- in-mark A: two strokes + a circle (replaces the crossbar).
       A width = 48 (chip 84, ~12.5px visual margin each side).
       Circle moved up to be tangent to the inner edges of both diagonals; diameter 20.4. -->
  <path d="M32 68 L56 20 L80 68"
        fill="none"
        stroke="#383838"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="56" cy="54" r="10.2" fill="#383838" mask="url(#bite)"/>
  <!-- tighter, cleaner wordmark -->
  <text x="106" y="71"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="74"
        fill="#1F2937"
        letter-spacing="-2.1">
    <tspan fill="#23A36F">Co</tspan><tspan fill="#4D7CF3" dx="4">work</tspan>
  </text>
</svg>
