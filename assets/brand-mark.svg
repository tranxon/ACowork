<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 96" width="396" height="96" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <!-- A 的应用图标风格背景：84x84 圆角方形（A 字面高度 ≈56 × 1.5 ≈84），Rose 高亮色 -->
  <rect x="14" y="2" width="84" height="84" rx="18" ry="18" fill="#f43f5e"/>
  <!-- 白色 A：字号 80，水平居中于方形 (x=56)，视觉中心 y=44 与 Co work 对齐 -->
  <text x="56" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="80"
        fill="#FFFFFF"
        text-anchor="middle">A</text>
  <!-- Co work：与图标右侧留 8px 间距，保持原配色（绿 Co / 蓝 work）与原字号 -->
  <text x="106" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="80"
        letter-spacing="-2.4"><tspan fill="#34A853">Co</tspan><tspan fill="#4285F4" dx="5">work</tspan></text>
</svg>