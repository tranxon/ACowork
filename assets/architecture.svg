<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="800" fill="#ffffff" rx="12" />

  <!-- ==================== DESKTOP APP BOX ==================== -->
  <rect x="20" y="20" width="960" height="110" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5" />
  <text x="500" y="48" text-anchor="middle" fill="#92400e" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Desktop App (Tauri v2 · localhost only)</text>

  <!-- Desktop sub-boxes -->
  <rect x="40" y="65" width="200" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="140" y="92" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">React/TS UI</text>

  <rect x="260" y="65" width="200" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="360" y="92" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HTTP Client</text>

  <rect x="480" y="65" width="200" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="580" y="92" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MQTT Subscriber</text>

  <rect x="700" y="65" width="200" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="800" y="92" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tauri Rust Backend</text>

  <!-- Sub-text under sub-boxes -->
  <text x="140" y="123" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">(no state persistence)</text>
  <text x="360" y="123" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">REST → :19876</text>
  <text x="580" y="123" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">SUB → :19875</text>
  <text x="800" y="123" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">system tray / etc.</text>

  <!-- Down arrows from Desktop to Gateway -->
  <line x1="360" y1="130" x2="360" y2="148" stroke="#94a3b8" stroke-width="2" />
  <polygon points="353,148 360,158 367,148" fill="#94a3b8" />
  <text x="370" y="143" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">HTTP REST</text>

  <line x1="580" y1="130" x2="580" y2="148" stroke="#94a3b8" stroke-width="2" />
  <polygon points="573,148 580,158 587,148" fill="#94a3b8" />
  <text x="590" y="143" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">MQTT SUB</text>

  <!-- ==================== GATEWAY BOX ==================== -->
  <rect x="20" y="160" width="960" height="240" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="500" y="188" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Gateway (Daemon)</text>

  <!-- Three protocol-level boxes -->
  <rect x="40" y="205" width="280" height="100" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" />
  <rect x="40" y="205" width="280" height="22" rx="8" fill="#0ea5e9" />
  <rect x="40" y="218" width="280" height="9" fill="#0ea5e9" />
  <text x="180" y="222" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HTTP API</text>
  <text x="180" y="250" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Axum (Rust)</text>
  <text x="180" y="268" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">:19876 · localhost</text>
  <text x="180" y="286" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CRUD · config · REST · reverse proxy</text>

  <rect x="340" y="205" width="280" height="100" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" />
  <rect x="340" y="205" width="280" height="22" rx="8" fill="#8b5cf6" />
  <rect x="340" y="218" width="280" height="9" fill="#8b5cf6" />
