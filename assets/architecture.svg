  <text x="480" y="250" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">rumqttd (embedded)</text>
  <text x="480" y="268" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">:19875 · localhost</text>
  <text x="480" y="286" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">events · status · will · retained</text>

  <rect x="640" y="205" width="320" height="100" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="640" y="205" width="320" height="22" rx="8" fill="#f59e0b" />
  <rect x="640" y="218" width="320" height="9" fill="#f59e0b" />
  <text x="800" y="222" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HTTP Reverse Proxy → Runtime</text>
  <text x="800" y="250" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">per-Runtime localhost server</text>
  <text x="800" y="268" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">bulk queries · historical messages</text>
  <text x="800" y="286" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">forwards on the request path only</text>

