  <text x="500" y="340" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Internal services</text>
  <text x="500" y="358" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Package Manager · Lifecycle · Intent Router · Budget Tracker · Rate Limiter · Vault · Config Manager</text>
  <text x="500" y="374" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">+ Global Resources Publisher · MQTT Session Multiplexer</text>

  <!-- Down arrows from Gateway to Runtimes (3 Runtimes) -->
  <!-- Runtime centerlines: 188, 500, 812 (for 3 boxes of width ~320 each at y=440+) -->

  <!-- HTTP Reverse Proxy arrows (orange) -->
  <line x1="720" y1="400" x2="188" y2="438" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" />
  <line x1="760" y1="400" x2="500" y2="438" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" />
  <line x1="800" y1="400" x2="812" y2="438" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="858" y="425" fill="#d97706" font-family="system-ui, sans-serif" font-size="10">HTTP RP</text>

  <!-- MQTT Broker arrows (purple) -->
