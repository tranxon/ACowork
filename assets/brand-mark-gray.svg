<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 96" width="396" height="96" role="img" aria-label="ACowork">
  <title>ACowork</title>
  <defs>
    <!--
      Theme-aware monochrome mark for empty-chat backgrounds.
      Both light (page-bg ≈ #FCFCFC) and dark (page-bg ≈ #131316) surfaces
      are accommodated via prefers-color-scheme. All fills stay strictly
      within the black/gray band so the mark never introduces a hue into
      a neutral surface.

      Light: chip #D4D4D4 → #B0B0B0, "A" 3-tone (circle #E8, left #C8, right #A8),
            wordmark #6B6B6B. Co (#5A5A5A) > work (#9A9A9A) so "A" first, "Co" second.
      Dark:  chip #3A3A3A → #2A2A2A, "A" 3-tone (circle #E8, left #C8, right #A8),
            wordmark #A8A8A8. Co (#C8C8C8) > work (#7A7A7A).
            The A gradient runs light (circle) → mid (left stroke) → dark (right stroke),
            mirroring the color variant's depth cue. Same A tones in both modes:
            the chip background inverts, the A itself does not.
    -->
    <style>
      .chip-stop-a { stop-color: #D4D4D4; }
      .chip-stop-b { stop-color: #B0B0B0; }
      .chip-shadow { flood-color: #000000; flood-opacity: 0.08; }
      .letter-a    { fill: #E8E8E8; }
      .letter-a-left { stroke: #C8C8C8; }
      .letter-a-right { stroke: #A8A8A8; }
      .wordmark    { fill: #6B6B6B; }
      .co          { fill: #5A5A5A; }
      .work        { fill: #9A9A9A; }

      @media (prefers-color-scheme: dark) {
        .chip-stop-a { stop-color: #3A3A3A; }
        .chip-stop-b { stop-color: #2A2A2A; }
        .chip-shadow { flood-color: #000000; flood-opacity: 0.30; }
        .letter-a    { fill: #E8E8E8; }
        .letter-a-left { stroke: #C8C8C8; }
        .letter-a-right { stroke: #A8A8A8; }
        .wordmark    { fill: #A8A8A8; }
        .co          { fill: #C8C8C8; }
        .work        { fill: #7A7A7A; }
      }
    </style>
    <linearGradient id="bg" x1="14" y1="2" x2="98" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   class="chip-stop-a"/>
      <stop offset="100%" class="chip-stop-b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" class="chip-shadow"/>
    </filter>
    <!-- Apple-style bite: white reveals the dot; black bite circle (offset right, vertically centered) carves the C silhouette that mirrors the wordmark's "Co". -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="40" y="40" width="40" height="40">
      <rect x="40" y="40" width="40" height="40" fill="white"/>
      <circle cx="62" cy="54" r="3.6" fill="black"/>
    </mask>
  </defs>
  <!-- neutral chip (light: mid-gray; dark: near-black) -->
  <rect x="14" y="2" width="84" height="84" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- "A" — always the loudest element, regardless of theme.
       Strokes are separated at the apex: the left stroke runs to the apex,
       the right stroke ends short with its own round cap (centerline end
       (63.4,34.8), ~16.5 px from the apex) leaving a ~3 px gap. -->
  <path d="M32 68 L56 20"
        fill="none"
        class="letter-a-left"
        stroke-width="10"
        stroke-linecap="round"/>
  <path d="M63.4 34.8 L80 68"
        fill="none"
        class="letter-a-right"
        stroke-width="10"
        stroke-linecap="round"/>
  <circle cx="56" cy="54" r="10.2" class="letter-a" mask="url(#bite)"/>
  <!-- wordmark: Co > work in weight to preserve the brand's emphasis order -->
  <text x="106" y="71"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="74"
        class="wordmark"
        letter-spacing="-2.1">
    <tspan class="co">Co</tspan><tspan class="work" dx="4">work</tspan>
  </text>
</svg>
