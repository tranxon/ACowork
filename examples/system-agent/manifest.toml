# System Agent — com.acowork.system
# The "system app" of ACowork, analogous to Android's Settings/Contacts.
# Always started with Gateway, cannot be uninstalled.

agent_id = "com.acowork.system"
version = "1.0.0"
name = "ACowork"
display_name = "ACowork"
role = "System Agent"
description = "ACowork system agent: manages user identity, preferences, and system-level services"
author = "ACowork Team"
runtime_version = "0.1.0"
system = true
dev = false

# System Agent has broad permissions
[[permissions]]
type = "MemoryRead"

[[permissions]]
type = "MemoryWrite"

[[permissions]]
type = "IntentSend"
value = "*"

triggers = []

# System Agent does NOT declare identity_deps — it IS the identity provider
identity_deps = []

# Tool opt-in declarations (ADR-029).
# System Agent is the identity & preferences provider — the always-on system
# component. Tool set is kept intentionally minimal (no FS / Network / Shell
# permissions declared → no related tools): only what's required to serve
# other agents and persist identity data.

# --- Memory (user identity & preferences) ---
[[tools]]
name = "memory_recall"

[[tools]]
name = "memory_store"

# --- Cross-agent messaging ---
[[tools]]
name = "intent_send"

[llm]
temperature = 0.5

[memory]
enabled = true
retention_days = 365

[resources]
max_memory_mb = 512
idle_timeout_secs = 0   # System Agent never auto-stops

[sandbox]
enabled = false

# ContentProvider-style capabilities for other agents
# identity:query and identity:observe have been removed — user identity
# is now managed by Gateway via UserProfile (see 18-user-identity-simplified.md)
