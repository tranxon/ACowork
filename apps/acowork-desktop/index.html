<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACowork</title>
    <script>
      // Detect system dark mode before React renders — prevents flash of wrong theme.
      // The window starts with visible:false (tauri.conf.json) and is shown only
      // after React renders, so there's no user-visible flash.
      (function() {
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* Keep html/body transparent so the OS-native blur layer
         (DWM Acrylic on Windows, NSVisualEffectView on macOS) can
         show through.  The resize-reflow placeholder is handled by
         the Rust-side WindowEffectsConfig.color, not by CSS. */
      html, body {
        margin: 0;
        padding: 0;
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
