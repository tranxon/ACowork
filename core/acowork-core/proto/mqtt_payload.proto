syntax = "proto3";

package acowork.mqtt.v1;

// MQTT payload definitions for the ACowork.AI event bus.
//
// This file is INDEPENDENT from gateway_ipc.proto:
//   - Separate namespace (acowork.mqtt.v1 vs acowork.gateway.v1)
//   - No shared `service` declaration
//   - No shared `message` definitions
//
// All MQTT PUBLISH payloads are wrapped in `DataEnvelope`. The `payload`
// oneof is extended when a new data resource is added to the topic tree.
// See docs/zh/protocols/mqtt.md for the topic tree and channel boundaries.
//
// Design principles (mqtt.md §3.5):
//   - Single topic + Retained for snapshot+incremental semantics
//   - Payload is always the latest complete value (no diff/update variants)
//   - Field numbers are never reused (protobuf backward compatibility)

// ── Envelope ───────────────────────────────────────────────────────────

/// Unified envelope for every MQTT PUBLISH payload.
///
/// `version` is the protocol version (currently 1). Bump only on
/// incompatible envelope-level changes — individual payload messages
/// evolve via field addition per protobuf conventions.
message DataEnvelope {
  uint32 version = 1;
  oneof payload {
    // ── Global resources (Gateway → all Runtimes, Retained) ──
    AvailableProviders       available_providers       = 10;
    AvailableMcps            available_mcps            = 11;
    AvailableSearches        available_searches        = 12;
    AvailableEmbeddingModels available_embedding_models = 13;
    AvailableLsps            available_lsps            = 14;
    // ADR-042: Active user identity. Single-snapshot topic; Runtime uses
    // this to populate `identity_context` for the compact model's
    // language hint and for general per-user preferences.
    AvailableUsers           available_users           = 15;
    // ADR-059: Bootstrap capability-readiness snapshot. Single retained
    // topic (`acowork/global/bootstrap`, QoS 1) that aggregates Gateway's
    // internal subsystem readiness into a `phase` enum + `instance_id`
    // and monotonic `version`. Field number 16 is occupied and will
    // never be reused; subsequent global-snapshot messages start at 17.
    BootstrapState           bootstrap_state           = 16;

    // ── Agent lifecycle (Runtime → subscribers, Retained) ──
    AgentStatus              agent_status              = 20;
    AgentMeta                agent_meta                = 21;
    AgentConfig              agent_config              = 22;

    // ── Session lifecycle (Runtime → Desktop) ──
    SessionCreated           session_created           = 30;
    SessionDeleted           session_deleted           = 31;
    // ADR-043: SessionMeta (field 32) removed. Split into SessionConfig
    // (field 33) for user-configurable fields and SessionState (field 37)
    // for runtime telemetry, eliminating stale-value races where Hot meta
    // updates carried outdated config field values.
    SessionConfig            session_config            = 33;
    SessionMessage           session_message           = 34;
    SessionOpened            session_opened            = 35;
    SessionNotOpened         session_not_opened        = 36;
    SessionState             session_state             = 37;
    // ADR-058: Workspace filesystem change events (Runtime → Desktop,
    // QoS 1, non-retained). Topic:
    // acowork/agents/{id}/workspaces/{wid}/fs-changed
    // Field number 38 is occupied by this message and will never be
    // reused. Future workspace-related messages start at 39.
    WorkspaceFsChangeEvent   workspace_fs_change_event = 38;

    // ── Control commands (Desktop → Runtime) ──
    ControlCommand           control_command           = 40;

    // ── Memory (Runtime → subscribers) ──
    MemoryNodeUpdate         memory_node_update        = 50;

    // ADR-048: Debug protocol events (Runtime → Desktop DevMode, QoS 0).
    // Topics: `acowork/agents/{agent_id}/debug/events/{event_type}`.
    // The Desktop App subscribes to `agents/{id}/debug/events/#` and
    // routes each event by tag. Events are best-effort — DevMode may
    // drop 1-2 events on reconnect without functional impact.
    DebugStepEvent           debug_step_event          = 70;
    DebugBreakpointEvent     debug_breakpoint_event    = 71;
    DebugRecordStepEvent     debug_record_step_event   = 72;
    DebugStateChangeEvent    debug_state_change_event  = 73;
    DebugContextBuiltEvent   debug_context_built_event = 74;

    // ── Sidecar (Sidecar → subscribers, Retained) ──
    SidecarStatus            sidecar_status            = 60;

    // ── Node control plane (ADR-055 §6.2, Node ↔ Gateway) ──
    NodeInfo                 node_info                 = 81;
    NodeControlCommand       node_control_command      = 82;
    NodeEvent                node_event                = 83;
    // ADR-055 §6.5: per-agent installed-package inventory entry
    // (Node → Gateway, Retained). The Gateway aggregates these to
    // rebuild its installed_agents view (Phase 2b.3 hard-cut).
    InstalledAgentInfo       installed_agent_info      = 84;
    // ADR-055 §6.12 / Phase 5a security: node enrollment handshake
    // (Node → Gateway on `acowork/nodes/{node_id}/enroll`, Gateway →
    // Node on `acowork/nodes/{node_id}/enroll_result`). Both are
    // QoS 1 non-retained.
    NodeEnroll               node_enroll               = 85;
    NodeEnrollResult         node_enroll_result        = 86;
    // ADR-059: Node control-plane readiness (Node → Gateway, Retained).
    // Topic: acowork/nodes/{node_id}/ready (QoS 1, retained). Node
    // publishes it AFTER MQTT CONNECT succeeds AND every control
    // subscription is confirmed; Gateway re-marks `node.{id}` as
    // ready in the SubsystemReadinessRegistry on receipt. Field 87
    // is occupied and will never be reused.
    NodeReady                node_ready                = 87;
  }
}

// ── Global resources: available state (§3.1.1) ────────────────────────

/// Available providers — Gateway health-check verified.
/// Topic: acowork/global/providers (Retained, QoS 1)
message AvailableProviders {
  /// Monotonic version. Runtime compares to detect stale pushes.
  uint64 version = 1;
  repeated ProviderRef providers = 2;
  // ADR-056: Global default compact model — picked by the user from across
  // all configured providers. Runtime distillation fallback chain:
  //   ① this field (if Some and the target provider is available)
  //   ② provider.compact_model on the session's current provider
  //   ③ the session's current chat model
  // Absent / unset = no global override; behavior degrades to legacy chain.
  optional CompactModelRef default_compact_model = 7;
}

/// ADR-056: Reference to a (provider_id, model_id) pair.
///
/// Used for cross-provider selections such as the global default compact
/// model. Mirrors the on-disk `agent_provider.json` top-level
/// `default_compact_model` object.
message CompactModelRef {
  /// Provider identifier (matches `ProviderRef.id`).
  string provider_id = 1;
  /// Model identifier within that provider.
  string model_id = 2;
}

/// Available MCP servers — Gateway health-check verified.
/// Topic: acowork/global/mcps (Retained, QoS 1)
message AvailableMcps {
  uint64 version = 1;
  repeated McpRef servers = 2;
}

/// Available search providers — Gateway health-check verified.
/// Topic: acowork/global/searches (Retained, QoS 1)
message AvailableSearches {
  uint64 version = 1;
  repeated SearchRef providers = 2;
}

/// Available embedding models — loaded into ONNX runtime.
/// Topic: acowork/global/embedding_models (Retained, QoS 1)
message AvailableEmbeddingModels {
  uint64 version = 1;
  repeated EmbeddingModelRef models = 2;
  /// Active model ID (the one currently loaded), if any.
  string active_model_id = 3;
  /// Active embedding vector dimension, if a model is loaded.
  uint32 active_dimension = 4;
  /// Local embedding HTTP endpoint (e.g. "http://127.0.0.1:18080/v1").
  /// Always populated as long as the ONNX sidecar is running — used as
  /// Tier-1 fallback when the active cloud provider is unavailable or
  /// rate-limited.
  string endpoint = 5;

  // ── Cloud Embedding Provider (ADR-s1: 云端 provider 与本地 ONNX 并存) ──
  /// Active cloud embedding provider ID (e.g. "volcengine",
  /// "dashscope", "siliconflow"), or empty string when the user has
  /// not selected a cloud provider. When set, Runtime should prefer
  /// the cloud provider over the local ONNX endpoint above.
  string active_provider_id = 6;
  /// Decrypted API key for `active_provider_id`. NEVER persisted to
  /// workspace disk by Runtime — same security contract as the
  /// provider / search keys on the other global topics.
  ///
  /// Empty when no key is configured or no cloud provider is selected.
  string active_api_key = 7;
  /// Base URL of the active cloud provider (e.g.
  /// "https://ark.cn-beijing.volces.com/api/v3"). Copied from the
  /// provider catalog at selection time so the Runtime can construct
  /// a RemoteEmbeddingProvider without re-fetching the catalog.
  ///
  /// Empty when no cloud provider is selected.
  string active_base_url = 8;
}

/// Available LSP relays — single sidecar process.
/// Topic: acowork/global/lsps (Retained, QoS 1)
message AvailableLsps {
  uint64 version = 1;
  /// HTTP endpoint of the LSP relay, if running.
  string endpoint = 2;
  /// Whether the relay is healthy and ready.
  bool ready = 3;
}

// ── User identity (ADR-042) ─────────────────────────────────────────────

/// Available users — current active user profile snapshot.
///
/// Topic: acowork/global/user_profile (Retained, QoS 1).
///
/// This topic closes a gap left by ADR-040 (gRPC hello_config removed)
/// and ADR-033 (which did not include UserProfile in its MQTT topic
/// tree). The Gateway is the Owner: it holds the active user in
/// `resource_cache.user_profile_list` and re-publishes on every change.
///
/// `active_user` is empty when no user has been created (fresh Gateway
/// install). Runtime treats empty as "no identity" and falls back to
/// detection-based heuristics in the compaction prompt.
///
/// Note: this topic carries ONLY the active user, not the full user
/// list. Multi-user isolation (different user → different agent view)
/// is a separate concern handled by §3.4 user-scoped topics in mqtt.md.
message AvailableUsers {
  /// Monotonic version. Mirrors `user_profile_list.version`. Runtime
  /// compares to detect stale pushes (retained re-delivery ordering).
  uint64 version = 1;
  /// The active user profile. Empty (`user_id == ""`) means no active
  /// user; Runtime treats this as "no identity".
  UserProfileRef active_user = 2;
}

/// Lightweight user profile reference.
///
/// Mirrors the relevant fields of
/// `acowork_core::protocol::UserProfile` (Runtime's identity_context
/// uses the full struct). UI-only fields (avatar, builtin_avatar,
/// created_at, updated_at, is_active) are deliberately omitted —
/// Runtime never renders user profile UI.
///
/// `custom_json` is a JSON-serialised `HashMap<String, String>` so the
/// wire format stays simple (avoids embedding `map<string,string>`
/// which complicates the schema and consumers).
message UserProfileRef {
  /// UUID v4. Empty when no active user.
  string user_id = 1;
  /// Display name — what the user wants to be called.
  string display_name = 2;
  /// Preferred language (BCP 47, e.g. "zh-CN", "en-US"). Used by
  /// the compact model's system prompt to pick the summary language.
  string language = 3;
  /// Timezone (IANA, e.g. "Asia/Shanghai", "UTC").
  string timezone = 4;
  optional string city = 5;
  optional string country = 6;
  optional string occupation = 7;
  /// "concise" | "detailed" | "casual" | ...
  optional string communication_style = 8;
  /// Free-form extension fields, JSON-serialised. Empty string when
  /// the user has no custom preferences.
  string custom_json = 9;
}

// ── Provider reference (mirrors ProviderListItem; carries the decrypted
//     API key inline so Runtime does not need a separate handshake) ───

/// LLM provider reference published on `acowork/global/providers`.
///
/// Carries the decrypted API key inline (in `api_key`). MQTT broker runs
/// on localhost only (Gateway embeds the broker — see rumqttd), so the
/// retained payload is not exposed to the network. The key is decrypted
/// by the Gateway before PUBLISH (see [`MqttGlobalResourcesPublisher`])
/// and consumed by Runtime's startup cache.
message ProviderRef {
  string id = 1;
  string base_url = 2;
  LlmProtocol protocol_type = 3;
  repeated ProviderModelRef models = 4;
  string compact_model = 5;  // empty = none
  bool custom = 6;
  /// Decrypted API key for this provider. Empty when the provider has
  /// no key configured (e.g. local Ollama). Runtime uses this to populate
  /// the LLM provider's auth header directly; no env var or separate
  /// handshake is required.
  string api_key = 7;
}

/// LLM protocol type (mirrors ProtocolType from domain).
enum LlmProtocol {
  LLM_PROTOCOL_UNSPECIFIED = 0;
  LLM_PROTOCOL_OPENAI = 1;      // OpenAI-compatible (default)
  LLM_PROTOCOL_ANTHROPIC = 2;   // Anthropic Messages API
  LLM_PROTOCOL_GOOGLE = 3;      // Google Gemini
  LLM_PROTOCOL_OLLAMA = 4;      // Ollama native
}

/// Model entry within a provider reference.
message ProviderModelRef {
  string id = 1;
  ModelCapabilities capabilities = 2;
  uint64 max_output_tokens_limit = 3;
}

/// Model capabilities (mirrors ModelCapabilitiesInfo).
message ModelCapabilities {
  uint64 context_window = 1;
  uint64 max_output_tokens = 2;
  repeated string input_modalities = 3;
  repeated string output_modalities = 4;
  // Cost info omitted from MQTT — Runtime doesn't need it for invocation.

  // Reasoning support. Optional wrappers because prost can't encode
  // Option<T> directly — the Runtime treats absent as "unknown".
  optional bool supports_reasoning = 5;
  optional string default_reasoning_effort = 6;
}

// ── MCP reference (mirrors McpListItem; carries auth token inline) ────

/// MCP server reference published on `acowork/global/mcps`.
///
/// `headers` and `auth_token` together replace the missing
/// `mcp_key_vault` in the gRPC AgentHello handshake — the Gateway
/// decrypts the token at PUBLISH time and Runtime uses it directly
/// when establishing the MCP connection.
message McpRef {
  string id = 1;
  string name = 2;
  McpTransport transport = 3;
  string url = 4;           // empty for stdio
  string command = 5;       // empty for http/sse
  repeated string args = 6;
  map<string, string> env = 7;
  map<string, string> headers = 8;
  uint64 tool_timeout_secs = 9;  // 0 = no override
  /// Decrypted MCP bearer token (empty = no auth required).
  string auth_token = 10;
}

/// MCP transport type (mirrors McpTransportDef).
enum McpTransport {
  MCP_TRANSPORT_UNSPECIFIED = 0;
  MCP_TRANSPORT_STDIO = 1;
  MCP_TRANSPORT_HTTP = 2;
  MCP_TRANSPORT_SSE = 3;
}

// ── Search reference (mirrors SearchProviderListItem; key inline) ──────

/// Search provider reference published on `acowork/global/searches`.
///
/// `api_key` is the decrypted search provider key (Brave / Serper /
/// etc.). Runtime uses it directly when calling the search endpoint.
message SearchRef {
  string id = 1;
  string name = 2;
  string description = 3;
  bool requires_api_key = 4;
  string base_url = 5;
  /// Decrypted search API key (empty = no key required).
  string api_key = 6;
}

// ── Embedding model reference (mirrors EmbeddingModelEntry) ────────────

/// Lightweight embedding model reference for the available-state topic.
message EmbeddingModelRef {
  string id = 1;
  string name = 2;
  string description = 3;
  uint32 dimension = 4;
  uint32 max_tokens = 5;
  uint64 size_mb = 6;
  repeated string languages = 7;
  string hf_repo = 8;
  string onnx_file = 9;
  string tokenizer_file = 10;
  bool bundled = 11;
  bool recommended = 12;
}

// ── Agent lifecycle (§3.2) — Phase 2/3 stubs ──────────────────────────

/// Agent online/offline status.
/// Topic: acowork/agents/{id}/status (Retained + LWT)
message AgentStatus {
  string agent_id = 1;
  bool online = 2;
  // True when the Runtime self-published `"sleeping"` just before
  // `process::exit(0)` (idle auto-sleep, see
  // `acowork-runtime::agent::idle_watcher`). Lets the Desktop render an
  // "auto-slept at HH:MM" badge distinct from a manual stop. Mutually
  // informative with `online` — `online=true, sleeping=true` means
  // "process just exited via idle, retained message still cached".
  bool sleeping = 3;
}

/// Agent metadata.
/// Topic: acowork/agents/{id}/meta (Retained)
message AgentMeta {
  string agent_id = 1;
  string name = 2;
  string version = 3;
  string avatar = 4;       // empty = none
  string builtin_avatar = 5;
  // Reserved for Phase 2: full manifest fields as needed
}

/// Agent runtime config (Runtime's current effective agent_config.json).
/// Topic: acowork/agents/{id}/config (Retained)
message AgentConfig {
  string agent_id = 1;
  // The full agent_config.json content as a JSON string.
  // This avoids duplicating the config schema in protobuf and lets
  // the Runtime evolve its config format independently.
  string config_json = 2;
}

// ── Session lifecycle (§3.2) — Phase 2/3 stubs ────────────────────────

/// Session creation event (sid in payload, not in topic path).
/// Topic: acowork/agents/{id}/sessions/created
message SessionCreated {
  string agent_id = 1;
  string session_id = 2;
  string title = 3;
  string created_at = 4;  // ISO 8601
}

/// Session deletion event.
/// Topic: acowork/agents/{id}/sessions/deleted
message SessionDeleted {
  string agent_id = 1;
  string session_id = 2;
  string deleted_at = 3;  // ISO 8601
}

/// Session config (always latest complete value).
/// Topic: acowork/agents/{id}/sessions/{sid}/config (Retained)
///
/// ADR-043: carries only user-configurable fields. Runtime telemetry
/// (status, tokens, message_count) is published separately via SessionState
/// on the `sessions/{sid}/state` topic. This split eliminates stale-value
/// races where Hot meta updates (triggered by message_count changes during
/// LLM streaming) carried outdated config field values and reverted
/// frontend optimistic updates.
/// Current availability of the LLM resources required for this session to
/// run a chat turn (vault / default provider / default model).
///
/// Retained together with SessionConfig on `sessions/{sid}/config`; Runtime
/// re-PUBLISHes the full SessionConfig snapshot whenever this value
/// transitions, so reconnecting clients converge on the latest.
///
/// Why a separate enum (not `bool has_llm`):
///   - `UNSPECIFIED`/`LOADING` are transient and must NOT be treated as
///     "not configured" — the previous boolean check caused the Desktop
///     to flash an LLM-misconfigured banner for ~50 ms on every startup
///     (vault had not been queried yet).
///   - `MISSING` is the steady-state "user has no provider configured yet"
///     signal — the Desktop MUST render the warning here.
///   - `CONFIGURED` is the steady-state "the vault has at least one usable
///     (provider, key/base_url) pair". NOTE: this is a **global-runtime**
///     signal (same value for every session of an agent); it does NOT
///     verify the session's own default (provider, model) resolves.
enum LlmAvailability {
  /// (0) proto3 default. Treated by the Desktop as "not yet synchronised"
  /// — render a neutral placeholder, never an error banner.
  LLM_AVAILABILITY_UNSPECIFIED = 0;

  /// Runtime is still resolving global resources (bootstrap not READY, or
  /// the vault has not produced its first AvailableProviders snapshot).
  /// Render a neutral loading strip; do NOT render the misconfigured banner.
  LLM_AVAILABILITY_LOADING = 1;

  /// Vault has at least one provider with a non-empty api_key (or a local
  /// base URL) that the Runtime could call. Global-runtime signal — shared
  /// across all sessions of an agent; does NOT check the session's default
  /// (provider, model). Frontend can offer chat normally.
  LLM_AVAILABILITY_CONFIGURED = 2;

  /// Vault is empty, or every provider lacks a usable api_key/base_url.
  /// The Runtime cannot run a chat turn; the Desktop MUST render the
  /// misconfigured banner and surface a "configure provider" call-to-action.
  LLM_AVAILABILITY_MISSING = 3;
}

message SessionConfig {
  string agent_id = 1;
  string session_id = 2;
  string title = 3;
  string provider_id = 4;
  string model_id = 5;
  string reasoning_effort = 6;  // "" = no override
  float  temperature = 7;       // NaN = no override (prost encodes float without Option)
  string workspace_id = 8;
  // Session-level LLM resource availability — see LlmAvailability enum docs.
  // Field number 9 is reserved for this enum and will not be reused.
  LlmAvailability llm_availability = 9;
}

/// Session runtime state (always latest complete value).
/// Topic: acowork/agents/{id}/sessions/{sid}/state (Retained)
///
/// ADR-043: carries only runtime telemetry. User-configurable fields
/// (model, workspace, reasoning_effort, temperature, title) are published
/// separately via SessionConfig on the `sessions/{sid}/config` topic.
///
/// This message absorbs the fields previously carried by the deleted
/// SessionStateChangedPayload (status, ratio, context_usage).
/// The retained topic replaces the old non-retained
/// `messages/session_state_changed` event, ensuring reconnecting clients
/// immediately receive the latest state.
message SessionState {
  string agent_id = 1;
  string session_id = 2;
  string status = 3;
  uint64 message_count = 4;
  uint64 input_tokens = 5;
  uint64 output_tokens = 6;
  uint64 total_input_tokens = 7;
  uint64 total_output_tokens = 8;
  double ratio = 9;
  string context_usage = 10;
  string updated_at = 11;  // ISO 8601
}

/// Session message event (incremental, QoS 0).
/// Topic: acowork/agents/{id}/sessions/{sid}/messages/{event_type}
message SessionMessage {
  string agent_id = 1;
  string session_id = 2;
  oneof event {
    ChunkPayload          chunk           = 10;
    ToolCallPayload       tool_call       = 11;
    ToolResultPayload     tool_result     = 12;
    DonePayload           done            = 13;
    ErrorPayload          error           = 14;
    StoppedPayload        stopped         = 15;
    AskQuestionPayload    ask_question    = 16;
    TodoUpdatedPayload    todo_updated    = 17;
    ReasoningPayload      reasoning_started = 18;
    ReasoningPayload      reasoning_ended   = 19;
    CompactingPayload     compacting_started = 20;
    CompactingPayload     compacting_ended   = 21;
    ContextUsagePayload   context_usage   = 22;
    MemoryUpdatedPayload  memory_updated  = 23;
    SkillExecutedPayload       skill_executed          = 24;
    // ADR-043: SessionStateChangedPayload (field 25) removed. Its fields
    // (status, ratio, context_usage) are now carried by the
    // retained SessionState topic (sessions/{sid}/state).
    IterationLimitPausedPayload iteration_limit_paused = 26;
    ToolApprovalNeededPayload   tool_approval_needed    = 27;
    // DEPRECATED (ADR-035): superseded by `stream_delta`, which carries the
    // actual data instead of a pure signal. Kept for backward compatibility
    // during the dual-channel migration (Phase 1).
    NewDataAvailablePayload     new_data_available      = 28;
    // ADR-035: incremental streaming delta carrying whole new lines (QoS 0).
    StreamDeltaPayload          stream_delta            = 29;
    // ADR-035: a record finalized (committed to JSONL) carrying COMPLETE
    // content. Wired in Phase 2; proto defined now for the contract.
    RecordCompletePayload       record_complete         = 30;
    // Runtime detected a tool-call loop and paused the session. The frontend
    // displays the message and a "Continue" button so the user can decide
    // whether to let the loop proceed.
    LoopDetectedPausedPayload   loop_detected_paused    = 31;
    // ADR-045: Tool execution progress heartbeat. Carries elapsed_ms and
    // timeout_ms so the frontend can render a countdown / progress bar
    // WITHOUT downloading JSONL. Published every 5 s while a tool runs.
    // Short tools (5s) never trigger this event.
    ToolProgressPayload         tool_progress           = 32;
  }
}

message ChunkPayload {
  string message_id = 1;
  string delta = 2;
}

message ToolCallPayload {
  string message_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  string call_id = 4;
}

message ToolResultPayload {
  string call_id = 1;
  string result_json = 2;
  bool is_error = 3;
}

message DonePayload {
  string message_id = 1;
}

message ErrorPayload {
  string message_id = 1;
  string error = 2;
}

message StoppedPayload {
  string message_id = 1;
}

message AskQuestionPayload {
  string message_id = 1;
  string question_json = 2;
}

message TodoUpdatedPayload {
  string todos_json = 1;
}

message ReasoningPayload {
  string message_id = 1;
}

message CompactingPayload {
  string session_id = 1;
}

// ADR-033: ContextUsagePayload is delivered to the frontend on every
// LLM call completion. The frontend renders the StatusBar from this
// payload directly (chatStore `case "context_usage"`), so it must
// carry enough information to populate `ContextUsageInfo`:
// `context_window`, `input_tokens`, `output_tokens`, `total_tokens`,
// `usage_percent`, `usable_context`. The legacy 4 token-count fields
// are kept for backward compatibility with any in-flight Desktop
// subscriber; new code should consume `context_usage` (a
// fully-populated JSON-serialized `ContextUsageInfo`).
message ContextUsagePayload {
  string session_id = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 total_input_tokens = 4;
  uint64 total_output_tokens = 5;
  // Fully-populated JSON-serialized `ContextUsageInfo`. Includes
  // `context_window`, `total_tokens`, `usage_percent`, `usable_context`
  // and all optional cumulative fields. Frontend must prefer this over
  // the legacy individual token fields.
  string context_usage = 6;
}

message MemoryUpdatedPayload {
  string session_id = 1;
  string node_id = 2;
}

message SkillExecutedPayload {
  string session_id = 1;
  string skill_name = 2;
  bool success = 3;
}

// ADR-043: SessionStateChangedPayload removed. Its fields (status,
// ratio, context_usage) are now carried by the retained SessionState
// topic (sessions/{sid}/state), replacing the old non-retained
// `messages/session_state_changed` event.

message IterationLimitPausedPayload {
  string session_id = 1;
  uint32 iteration = 2;
  uint32 max_iterations = 3;
  string message = 4;
}

message LoopDetectedPausedPayload {
  string session_id = 1;
  string message = 2;
}

// ADR-045: Tool execution progress heartbeat. Carries elapsed_ms and
// timeout_ms so the frontend can render a countdown / progress bar
// WITHOUT downloading JSONL. Published every 5 s while a tool runs.
// Short tools (<5s) never trigger this event.
message ToolProgressPayload {
  string session_id = 1;
  string tool_call_id = 2;
  // Milliseconds since tool execution started (wall clock).
  uint64 elapsed_ms = 3;
  // Tool timeout in ms (= tool_timeout_ms). Used by the frontend to
  // compute the progress bar percentage.
  uint64 timeout_ms = 4;
}

message ToolApprovalNeededPayload {
  string session_id = 1;
  string request_id = 2;
  string tool_name = 3;
  string action = 4;
  string risk_level = 5;
  string reason = 6;
  string tool_call_id = 7;
  uint64 approval_timeout_secs = 8;
}

message NewDataAvailablePayload {
  string session_id = 1;
  uint32 interval_ms = 2;
  string title = 3;
}

// ── ADR-035: streaming delta with data (replaces NewDataAvailable signal) ──

/// A single COMPLETE streaming line pushed via MQTT `stream_delta`.
/// `content` is ALWAYS a whole line (terminated by '\n' in the source),
/// never a partial line or a token. The frontend appends each line to the
/// per-session active stream buffer; it never re-splits or re-joins.
message StreamLine {
  string role = 1;        // "thought" | "assistant"
  string message_id = 2;  // stable id of the streaming record ("" until assigned)
  uint32 line_no = 3;     // line index within the streaming record (informational)
  string content = 4;     // one complete line of text
}

/// Incremental streaming delta — whole new lines since the last push.
/// Topic: acowork/agents/{id}/sessions/{sid}/messages/stream_delta (QoS 1).
/// Pushed every `notify_interval_ms` (default 500); an empty push (no new
/// complete line) is never sent.
///
/// `seq` is a per-session monotonically-increasing counter assigned by the
/// Runtime's chunk_relay (single-threaded `fetch_add(1, SeqCst)`). The
/// Desktop uses it to insert this frame at the correct position in the
/// per-session messages[] even under rare cross-publisher reorder. When
/// missing (older Runtime), the Desktop falls back to "append to end".
message StreamDeltaPayload {
  string session_id = 1;
  repeated StreamLine lines = 2;
  optional uint64 seq = 3;
}

/// A record finalized (committed to JSONL). Carries the COMPLETE content.
/// Topic: acowork/agents/{id}/sessions/{sid}/messages/record_complete (QoS 1).
/// Wired in Phase 2 of ADR-035; Phase 1 keeps HTTP record delivery in parallel.
///
/// `tool_name` / `tool_call_id` / `is_error` are populated only when
/// `role` is `"tool_call"` or `"tool_result"`. For `"assistant"` and
/// `"thought"` they are empty strings. This mirrors the JSONL metadata
/// persisted alongside the record and lets the frontend reconstruct the
/// tool_call ↔ tool_result pairing without an extra HTTP round-trip.
///
/// `seq` is the per-session monotonic counter (see StreamDeltaPayload for
/// rationale). When present, it MUST match the seq of the matching
/// stream_delta placeholder for the same record; the Desktop uses it to
/// place this frame at the correct position.
message RecordCompletePayload {
  string session_id = 1;
  string role = 2;        // "assistant" | "thought" | "tool_call" | "tool_result"
  string message_id = 3;
  string content = 4;
  string tool_name = 5;    // empty unless role is tool_call / tool_result
  string tool_call_id = 6; // empty unless role is tool_call / tool_result
  bool is_error = 7;       // only meaningful when role is tool_result
  optional uint64 seq = 8;
}

// ── Workspace FS events (ADR-058, Runtime → Desktop, QoS 1, non-retained) ──

/// Aggregated workspace filesystem changes.
///
/// Topic: acowork/agents/{agent_id}/workspaces/{workspace_id}/fs-changed.
/// Published by the Runtime's `WorkspaceFsWatcher` (notify::PollWatcher,
/// 500ms poll + 500ms aggregation window). All changes detected within
/// one aggregation window are merged into a single event — multiple
/// modifications of the same file coalesce to one `Modified`, and a
/// create+delete pair inside the same window cancels out entirely.
message WorkspaceFsChangeEvent {
  string agent_id = 1;
  string workspace_id = 2;
  // All changes merged within the same aggregation window (500ms).
  repeated FsChange changes = 3;
  // Aggregation window flush time (epoch ms). Subscribers use it only
  // for logging / stale-event filtering, never for ordering (MQTT is
  // naturally ordered within one topic).
  uint64 window_end_ms = 4;
}

/// Kind of a single filesystem change.
///
/// Rename is deliberately NOT a variant: notify::PollWatcher is a
/// directory-snapshot diff with no inode pairing, so a rename degrades
/// to `Deleted(old)` + `Created(new)` (see ADR-058 §3.1).
enum FsChangeKind {
  FS_CHANGE_KIND_UNSPECIFIED = 0;
  FS_CHANGE_KIND_CREATED = 1;
  FS_CHANGE_KIND_MODIFIED = 2;
  FS_CHANGE_KIND_DELETED = 3;
}

/// A single filesystem change, normalized to a forward-slash
/// workspace-relative path (same style as the HTTP tree endpoints).
message FsChange {
  FsChangeKind kind = 1;
  // Forward-slash relative path within the workspace root.
  string path = 2;
  // Observation time (aggregator flush moment, epoch ms). The Desktop
  // uses it for stale-event filtering and echo suppression.
  uint64 timestamp_ms = 3;
}

// ── Control commands (§9) — Desktop → Runtime ─────────────────────────

/// Control command (sid in payload for routing).
/// Topic: acowork/agents/{id}/sessions/control/{cmd}
message ControlCommand {
  string agent_id = 1;
  oneof command {
    CreateSession       create_session        = 10;
    DeleteSession       delete_session        = 11;
    // 12, 13 reserved (原 MessageCommand / Stop 已迁移, 字段号保留空缺)
    CloseSession        close_session         = 19;
    UpdateSessionTitle  update_session_title  = 20;

    // ── Chat (5) ──
    ChatMessage         chat_message          = 21;
    Stop                stop                  = 22;
    ContinueExecution   continue_execution    = 23;
    EnableNotify        enable_notify         = 24;
    DisableNotify       disable_notify        = 25;

    // ── User responses to runtime prompts (2) ──
    ApprovalDecision    approval_decision     = 26;
    QuestionAnswer      question_answer       = 27;

    // ADR-045: cancel a single in-flight tool execution (does not stop the
    // surrounding iteration). tool_call_id matches the one the runtime
    // emitted via RecordComplete{ role: "tool_call" }.
    CancelTool          cancel_tool           = 30;

    // ── Per-session config (3) ──
    ModelSwitch         model_switch          = 14;
    ReasoningEffort     reasoning_effort      = 15;
    WorkspaceSwitch     workspace_switch      = 18;

    // ── Context management (2) ──
    CompactContext      compact_context       = 16;
    CompressAction      compress_action       = 28;

    // ── System (1) ──
    Intent              intent                = 17;

    // ── Session lifecycle (1) — ADR-038 ──
    OpenSession         open_session          = 29;

    // ── Presence (1) — frontend ↔ runtime idle heartbeat ──
    //
    // Periodically broadcast by the Desktop frontend (~every 15s) for the
    // currently selected agent. Pure observer signal — does NOT carry any
    // state-transition semantics. The Runtime's idle_watcher maintains
    // `last_heartbeat_at_ms` independently from `last_inbound_at_ms` and
    // renews the idle deadline while the heartbeat is fresh.
    //
    // Crash-safe by construction: if the frontend exits / disconnects,
    // heartbeats simply stop arriving and the watcher falls through to
    // the normal inbound-based deadline check after `heartbeat_timeout`.
    ActiveHeartbeat     active_heartbeat      = 32;
  }
}

// Empty payload — the heartbeat carries no data, only the act of being
// sent. Topic alone identifies the target agent
// (acowork/agents/{id}/control/active_heartbeat).
message ActiveHeartbeat {
}

message CreateSession {
}

message DeleteSession {
  string session_id = 2;
}

/// Graceful close: triggers distillation, preserves JSONL history.
/// Use Delete to also remove the file.
message CloseSession {
  string session_id = 2;
}

/// Explicit session activation (transitions Closed/NotFound → Active).
///
/// Idempotent for already-Active sessions. Triggers lazy-resume from disk for
/// Closed sessions. New semantic in v3.x (ADR-038) — NOT the legacy
/// "subscribe push" `activate_session` which was renamed `enable_notify` in
/// ADR-034 and removed in ADR-035 Phase 3.
message OpenSession {
  string session_id = 2;
}

message UpdateSessionTitle {
  string session_id = 2;
  string title = 3;
}

// ── Chat ─────────────────────────────────────────────────────────────────

/// User chat message with rich payload support.
///
/// Rich fields are carried via `params_json` (string-encoded JSON) to keep
/// MQTT messages small and let Runtime/LLM clients evolve the rich shape
/// independently from the proto schema. Document content is NOT inlined —
/// clients upload via HTTP `POST /sessions/{sid}/documents` and pass the
/// returned `doc_id` list in `params_json.document_ids` instead.
message ChatMessage {
  string session_id = 2;
  string message_id = 3;
  string content = 4;
  /// Optional slash command prefix (e.g. "/commit", "/review-pr")
  string command = 5;
  /// Rich payload as JSON. Shape:
  ///   {
  ///     "document_ids":     ["doc-abc"],      // uploaded via HTTP POST /documents
  ///     "content_parts":    [{type:"text",text:"..."}, {type:"image_url",image_url:{url:"..."}}],
  ///     "attached_context": [{abs_path, type:"file"|"selection", startLine?, endLine?}]
  ///   }
  /// Empty string = plain text only.
  string params_json = 6;
}

message Stop {
  string session_id = 2;
  /// Stop reason for logging. Free-form but conventionally:
  /// "user_requested" | "iteration_limit" | "budget_exceeded" | "error" | ...
  string reason = 3;
}

// ADR-045: Cancel a single in-flight tool execution. Distinct from Stop
// (which aborts the whole iteration) — the iteration continues after the
// cancelled tool returns a "Cancelled by user" result, and the LLM sees it
// in history.
message CancelTool {
  string session_id = 2;
  /// Tool call id as published by RecordComplete{ role: "tool_call" }.
  /// Unknown ids are silently dropped (race vs. tool natural completion).
  string tool_call_id = 3;
}

message ContinueExecution {
  string session_id = 2;
  /// "user_requested" | "auto_resume"
  string reason = 3;
}

message EnableNotify {
  string session_id = 2;
}

message DisableNotify {
  string session_id = 2;
}

// ── User responses ────────────────────────────────────────────────────────

message ApprovalDecision {
  string session_id = 2;
  string request_id = 3;
  bool approved = 4;
  bool allow_all_session = 5;
  /// Optional reason (e.g. user typed "this is a typo")
  string reason = 6;
}

message QuestionAnswer {
  string session_id = 2;
  string request_id = 3;
  string answer = 4;
}

// ── Per-session config ────────────────────────────────────────────────────

message ModelSwitch {
  string session_id = 2;
  string model_id = 3;
  // ADR-012: per-session provider override. Mirrors the `provider` field
  // from the gRPC/WebSocket-era model_switch payload. Empty string means
  // "do not change the current Provider instance — only update the model name".
  string provider_id = 4;
}

message ReasoningEffort {
  string session_id = 2;
  /// "low" | "medium" | "high" | "auto"
  string effort = 3;
}

message WorkspaceSwitch {
  string session_id = 2;
  string workspace_id = 3;
}

// ── Context management ────────────────────────────────────────────────────

message CompactContext {
  string session_id = 2;
}

enum CompressType {
  COMPRESS_TYPE_UNSPECIFIED  = 0;
  COMPRESS_TYPE_SUMMARY      = 1;  // → CompressionAction::CompressSummary
  COMPRESS_TYPE_TOOL_RESULTS = 2;  // → CompressionAction::CompressToolResults
}

message CompressAction {
  string session_id = 2;
  CompressType compress_type = 3;
}

// ── System ────────────────────────────────────────────────────────────────

/// Intent command — Gateway pushes an IntentReceived to a Runtime agent.
/// Used for cron triggers and cross-agent messaging via MQTT.
message Intent {
  /// Source of the intent (e.g. "cron:<agent_id>" for cron triggers).
  string from = 2;
  /// Action name (e.g. "hourly_check").
  string action = 3;
  /// Intent parameters as JSON.
  string params_json = 4;
}

// ── Memory (§3.2) — Phase 2/3 stubs ───────────────────────────────────

/// Memory node update (always latest complete node).
/// Topic: acowork/agents/{id}/memory/nodes/{nid}/update
message MemoryNodeUpdate {
  string agent_id = 1;
  string node_id = 2;
  string node_json = 3;  // full node as JSON
}

// ── Sidecar (§3.3) ────────────────────────────────────────────────────

/// Sidecar process status.
/// Topic: acowork/sidecar/{kind}/status (Retained)
message SidecarStatus {
  string kind = 1;       // "lsp_relay" | "embed" | ...
  string endpoint = 2;
  bool ready = 3;
  string spec_json = 4;  // sidecar-specific metadata
}

// ── Session lifecycle events (ADR-038) ────────────────────────────────────

/// Server-pushed acknowledgment of an OpenSession control command.
///
/// Published by Runtime after it has successfully transitioned the session
/// to the Active state (either by idempotent no-op or by lazy-resume from
/// disk). Desktop uses this to unlock the input area and to populate the
/// session header (model, provider, last_active_at).
///
/// Topic: acowork/agents/{id}/sessions/{sid}/opened (Retained)
message SessionOpened {
  string session_id = 1;
  /// "already_active" | "resumed_from_disk"
  string status = 2;
  string model = 3;
  string provider = 4;
  /// ISO-8601 timestamp from the session meta file, if available.
  string last_active_at = 5;
}

/// Server-pushed error when a session-level command targets a non-Active
/// session. Published by Runtime when ChatMessage / ModelSwitch / etc.
/// arrives for a session that has been closed or never existed.
///
/// Topic: acowork/agents/{id}/sessions/{sid}/not_opened
message SessionNotOpened {
  string session_id = 1;
  /// Name of the attempted command (e.g. "chat_message", "model_switch").
  string attempted_command = 2;
  /// "session_not_found" | "session_closed"
  string reason = 3;
}

// ── Debug protocol events (ADR-048) ───────────────────────────────────

/// `debugger.onStep` — a conversation step completed during agent loop.
///
/// Topic: acowork/agents/{agent_id}/debug/events/onStep (QoS 0).
/// The Desktop DevMode panel uses this to update the iteration timeline.
///
/// `input` / `output` are JSON values so the frontend can render any
/// payload shape without prior schema knowledge. `usage` follows the
/// same DebugUsage shape used by the agent loop (prompt/completion/total).
message DebugStepEvent {
  string session_id = 1;
  uint32 iteration = 2;
  /// DebugPhase (string): BudgetCheck | BuildContext | LlmCall | ParseResponse
  /// | ToolExecution | AppendHistory | Idle
  string phase = 3;
  /// LLM input context (optional, can be large).
  string input = 4;
  /// LLM output (optional, can be large).
  string output = 5;
  /// Token usage for this step (optional).
  uint64 prompt_tokens = 6;
  uint64 completion_tokens = 7;
  uint64 total_tokens = 8;
}

/// `debugger.onBreakpoint` — a breakpoint was hit.
///
/// Topic: acowork/agents/{agent_id}/debug/events/onBreakpoint (QoS 0).
/// Fired when the agent loop reaches a phase marked with a breakpoint
/// condition.
message DebugBreakpointEvent {
  string session_id = 1;
  string breakpoint_id = 2;
  uint32 iteration = 3;
  string phase = 4;
}

/// `debugger.onRecordStep` — a recorded replay step event.
///
/// Topic: acowork/agents/{agent_id}/debug/events/onRecordStep (QoS 0).
/// Fired during recording and replay to surface individual steps to the
/// DevMode timeline.
message DebugRecordStepEvent {
  string session_id = 1;
  uint32 step_index = 2;
  string phase = 3;
  /// Opaque step data (JSON string).
  string step_data = 4;
}

/// `debugger.onStateChange` — DebugState transitioned (Running/Paused/etc).
///
/// Topic: acowork/agents/{agent_id}/debug/events/onStateChange (QoS 0).
/// Subscribers use this to update their "Paused / Running / Stepping"
/// badge in the DevMode UI.
message DebugStateChangeEvent {
  string session_id = 1;
  /// DebugState: Running | Paused | Stepping | Stopped
  string new_state = 2;
  uint32 iteration = 3;
}

/// `debugger.onContextBuilt` — context snapshot was built for an iteration.
///
/// Topic: acowork/agents/{agent_id}/debug/events/onContextBuilt (QoS 0).
/// The Desktop uses this to refresh the context-tree view in the DevMode
/// panel. Sections carry metadata only (size/token/hash); full section
/// content is fetched lazily via `GET /api/debug/context/{iter}/sections/{name}`.
message DebugContextBuiltEvent {
  string session_id = 1;
  uint32 iteration = 2;
  uint64 total_token_estimate = 3;
  /// Section metadata: size_bytes, token_estimate, hash. Same fields as
  /// `DebugUsage`-style meta records in the existing protocol.
  map<string, SectionMeta> sections = 4;
  /// ADR-054 step 2: control params of the ChatRequest that built this
  /// snapshot (model / temperature / max_tokens / reasoning / thinking).
  /// Carried on the event so the panel's metadata bar renders immediately
  /// without a follow-up RPC round-trip.
  RequestParams request_params = 5;
}

/// Control params of a ChatRequest — mirrors the Debug Panel metadata bar.
message RequestParams {
  string model = 1;
  optional double temperature = 2;
  optional uint32 max_tokens = 3;
  optional string reasoning_effort = 4;
  optional string thinking_mode = 5;
}

/// Lightweight section metadata (size / tokens / hash).
///
/// Reuses the wire shape of [`SectionMeta`] defined for context snapshots.
message SectionMeta {
  uint64 size_bytes = 1;
  uint64 token_estimate = 2;
  string hash = 3;
}

// ── Node control plane (ADR-055 §6.2) ────────────────────────────────
//
// Topic family (client_id convention: "node:{node_id}"):
//   acowork/nodes/{node_id}/status                          plain text
//   "online"/"offline", QoS 1 Retained + LWT (mirrors the agent
//   status topic shape — the LWT must be a fixed payload fixed at
//   CONNECT time, so plain text is the contract).
//   acowork/nodes/{node_id}/info                            NodeInfo
//   envelope, QoS 1 Retained.
//   acowork/nodes/{node_id}/events                          NodeEvent
//   envelope, QoS 1 (node-level results: pong, diagnostics).
//   acowork/nodes/{node_id}/agents/{agent_id}/control/{cmd} NodeControlCommand
//   envelope, QoS 1 (Gateway → Node lifecycle commands).
//   acowork/nodes/{node_id}/agents/{agent_id}/events        NodeEvent
//   envelope, QoS 1 (per-agent execution results).
//
// Command/result correlation: every command carries a `request_id`;
// the Node echoes it in the NodeEvent reply. QoS 1 at-least-once
// delivery means duplicates are the norm — the Node de-duplicates by
// `request_id` and re-sends the cached result without re-executing
// (ADR-055 §6.2 idempotency discipline, aligned with ADR-039).

/// Node metadata snapshot (always latest complete value).
/// Topic: acowork/nodes/{node_id}/info (Retained, QoS 1)
message NodeInfo {
  string node_id = 1;
  /// Machine fingerprint (UUID v4, persisted in identity.json, ADR-055
  /// §6.12). Lets the Gateway detect "same name, different machine"
  /// enrollment conflicts and makes enrollment idempotent.
  string machine_uid = 2;
  string hostname = 3;
  string os = 4;      // std::env::consts::OS
  string arch = 5;    // std::env::consts::ARCH
  /// Version of the acowork-node binary (CARGO_PKG_VERSION).
  string node_version = 6;
  /// Node control-plane protocol version spoken by this node. The
  /// Gateway rejects install/start commands when below its minimum
  /// supported version (ADR-055 §6.9 version negotiation).
  uint32 protocol_version = 7;
  /// Capability tags — grows over the ADR-055 phases
  /// ("process", "package", "proxy", "sidecar", "fs_browse").
  repeated string capabilities = 8;
  /// Maximum concurrent Runtime processes (ADR-055 §6.18, default 16).
  uint32 max_agents = 9;
  /// Current running agent count (informational heartbeat).
  uint32 agent_count = 10;
  /// This node's reverse-proxy base URL (`http://{advertise_host}:{port}`,
  /// ADR-055 §6.3). The Gateway uses it to reach node-local HTTP services
  /// (e.g. `/fs/browse` for remote filesystem browsing, L7-1).
  string http_endpoint = 11;
}

/// Node → Gateway installed-agent inventory entry (ADR-055 §6.5).
/// Topic: acowork/nodes/{node_id}/agents/{agent_id}/installed
/// (Retained, QoS 1). The Node is the authority for its own package
/// inventory; the Gateway aggregates these into its installed_agents
/// view (replacing the pre-hard-cut on-disk scan, L2-9). An empty
/// payload (zero-length retained) clears the entry on uninstall.
message InstalledAgentInfo {
  string agent_id = 1;
  string version = 2;
  string name = 3;
  /// Node-local install path. The Gateway does NOT interpret this path
  /// for a remote node (diagnostic/display only until the Phase 2c
  /// reverse proxy); for the local node it is a real filesystem path.
  string install_path = 4;
  /// Full manifest.toml content. The Gateway parses this to rebuild its
  /// `AgentManifest` (capability registration, cron triggers, avatar).
  string manifest_toml = 5;
}

/// Gateway → Node command.
/// Topic: acowork/nodes/{node_id}/agents/{agent_id}/control/{cmd}
/// (agent-scoped lifecycle) or acowork/nodes/{node_id}/control/{cmd}
/// (node-scoped, currently only `ping`).
message NodeControlCommand {
  string node_id = 1;
  /// Correlation id — echoed by the Node in the NodeEvent reply.
  /// QoS 1 duplicates are detected by this id and not re-executed.
  string request_id = 2;
  oneof command {
    NodePing          ping           = 10;  // node-scoped liveness probe
    NodeStart         start          = 11;  // Phase 2b
    NodeStop          stop           = 12;  // Phase 2b
    NodeInstall       install        = 13;  // Phase 3 (remote package distribution)
    NodeUninstall     uninstall      = 14;  // Phase 2b
    NodeSkillsImport  skills_import  = 15;  // Phase 2b
    NodeAvatarUpdate  avatar_update  = 16;  // Phase 2b
    NodeClone         clone          = 17;  // Phase 3b (node-local clone)
    NodeUpgrade       upgrade        = 18;  // Phase 3b (package upgrade)
    NodePublishPrepare publish_prepare = 19; // Phase 3b (publish prepare)
    NodePublishBuild  publish_build  = 20;  // Phase 3b (publish build/sign)
  }
}

/// Liveness probe. Topic: acowork/nodes/{node_id}/control/ping.
message NodePing {
}

/// Start an agent Runtime on the node (idempotent: already-running
/// returns success with the existing PID, no second spawn).
message NodeStart {
  string agent_id = 1;
  bool dev_mode = 2;
}

/// Stop an agent Runtime (idempotent: already-exited returns success
/// after cleaning residual state).
message NodeStop {
  string agent_id = 1;
  string reason = 2;
}

/// Install an agent package on the node (async: Node replies 202-style
/// in-progress event, final result on the events topic).
message NodeInstall {
  string agent_id = 1;
  /// Gateway-side download URL for the .acw package (Phase 3).
  string package_url = 2;
  /// Node-local path of the already-spooled package file (Phase 2b
  /// single-machine: the Gateway spools the upload and hands the node a
  /// local path on the same filesystem). Mutually exclusive with
  /// `package_url`.
  string local_path = 3;
  /// Signature strictness (ADR-055 §6.20): `true` allows unsigned
  /// packages (local development), `false` requires a valid signature
  /// (production). Carried from the Gateway's own `dev_mode`.
  bool dev_mode = 4;
}

/// Uninstall an agent package (idempotent via atomic replace).
message NodeUninstall {
  string agent_id = 1;
}

/// Import a skills ZIP into an installed agent package.
message NodeSkillsImport {
  string agent_id = 1;
  /// Node-local path of the uploaded skill archive (Phase 2b).
  string zip_path = 2;
}

/// Update avatar assets inside an installed agent package.
message NodeAvatarUpdate {
  string agent_id = 1;
  /// Serialized avatar update request (mirrors the HTTP handler shape).
  string avatar_json = 2;
}

/// Clone an installed agent to a new agent ID (node-local operation,
/// ADR-055 §6.6 L2-5). The source and the new agent live on the SAME
/// node, so the clone copies the package directory directly — the
/// cross-machine memory export/import (§6.18 agent-affinity migration)
/// is a separate concern.
message NodeClone {
  string agent_id = 1;      // source agent
  string new_agent_id = 2;  // target agent
  string mode = 3;          // "skeleton" | "full"
}

/// Upgrade an installed agent to a new package version (async: the node
/// pulls the package and swaps the install directory, preserving data/
/// and config/).
message NodeUpgrade {
  string agent_id = 1;
  /// Gateway-hosted download URL for the new .acw package (Phase 3b).
  string package_url = 2;
  /// Node-local path of an already-spooled package file. Mutually
  /// exclusive with `package_url`.
  string local_path = 3;
  /// Signature strictness — mirrors `NodeInstall.dev_mode`.
  bool dev_mode = 4;
}

/// Run publish-preparation checks against an installed agent
/// (ADR-055 §6.6 L2-5). The node reports the structured result via
/// `NodeEvent.result_json`.
message NodePublishPrepare {
  string agent_id = 1;
  /// Whether to run cleanup (strip dev flag, clear recordings, reset
  /// config) in addition to the checks.
  bool clean = 2;
}

/// Build (and optionally sign) a .agent package on the node
/// (ADR-055 §6.6 L2-5). The node reports the structured result
/// (output_path / signed / file_size) via `NodeEvent.result_json`.
message NodePublishBuild {
  string agent_id = 1;
  /// Node-local output directory. Empty = the node's own packages_dir.
  string output_dir = 2;
  /// Whether to sign the built package.
  bool sign = 3;
  /// Node-local signing key directory (ignored when `sign` is false).
  string key_dir = 4;
}

/// Node → Gateway execution result, correlated by request_id.
/// Topic: acowork/nodes/{node_id}/events or
/// acowork/nodes/{node_id}/agents/{agent_id}/events (QoS 1).
message NodeEvent {
  string node_id = 1;
  string request_id = 2;
  /// "ok" | "error" | "not_implemented" | "in_progress"
  string status = 3;
  /// Human-readable detail (error message, diagnostics, PID, etc.).
  string message = 4;
  /// Optional structured result (JSON) for commands that return more
  /// than a status string — publish prepare/build carry their
  /// serialized result payloads here. Absent for simple commands.
  optional string result_json = 5;
}

/// Node → Gateway enrollment handshake (ADR-055 §6.12, Phase 5a
/// security). Topic: acowork/nodes/{node_id}/enroll (QoS 1,
/// non-retained). The Node presents its identity plus the one-time
/// enrollment token (issued via `nodes token create`); the Gateway
/// validates, then answers on the `enroll_result` topic with the
/// long-lived `node_token`.
message NodeEnroll {
  string node_id = 1;
  /// Machine fingerprint (UUID v4, persisted in identity.json) — lets
  /// the Gateway detect "same name, different machine" conflicts and
  /// make re-enrollment idempotent (same machine_uid reuses the token).
  string machine_uid = 2;
  string os = 3;      // std::env::consts::OS
  string arch = 4;    // std::env::consts::ARCH
  /// Version of the acowork-node binary (CARGO_PKG_VERSION).
  string node_version = 5;
  /// Node control-plane protocol version (mirrors NodeInfo.
  /// protocol_version).
  uint32 protocol_version = 6;
  /// Capability tags — mirrors NodeInfo.capabilities.
  repeated string capabilities = 7;
  /// One-time enrollment token (plaintext, only ever carried in this
  /// message). The Gateway stores only its sha256 hash and marks it
  /// consumed on success.
  string enrollment_token = 8;
}

/// Gateway → Node enrollment reply (ADR-055 §6.12, Phase 5a).
/// Topic: acowork/nodes/{node_id}/enroll_result (QoS 1, non-retained).
/// `status` mirrors the NodeEvent vocabulary ("ok" | "error").
message NodeEnrollResult {
  string node_id = 1;
  string machine_uid = 2;
  /// Long-lived per-node credential. Also used for HTTP-channel
  /// authentication via the `X-ACowork-Node-Token` header. The Node
  /// persists it into identity.json; present only on success.
  string node_token = 3;
  string status = 4;
  /// Human-readable detail ("enrolled", "token consumed", conflict
  /// explanation, etc.).
  string message = 5;
}

// ── ADR-059: Bootstrap capability-readiness snapshot ─────────────────────

/// Lifecycle phase of the Gateway's bootstrap, exposed via the single
/// retained snapshot on `acowork/global/bootstrap`. Aggregates the
/// readiness of every internal subsystem (vault, providers, MCPs,
/// embedding, runtime, sidecars, etc.) into one observable value.
///
/// OCP boundary — every addition is a new phase value + a `phase_detail`
/// string. Consumers MUST treat any unknown enum value as a transient
/// `DEGRADED` and refuse to act on it.
enum BootstrapPhase {
  BOOTSTRAP_PHASE_UNSPECIFIED = 0;
  /// Gateway is initialising subsystems; not yet accepting work.
  BOOTSTRAP_PHASE_BOOTING = 1;
  /// Every registered subsystem is ready. This is the steady state.
  BOOTSTRAP_PHASE_READY = 2;
  /// At least one subsystem is unhealthy but the Gateway can still
  /// serve a reduced feature surface (e.g. vault locked but vault-less
  /// requests still flow). Consumers should warn but proceed.
  BOOTSTRAP_PHASE_DEGRADED = 3;
  /// One or more critical subsystems have failed irrecoverably; the
  /// Gateway is shutting itself down. Consumers MUST surface this and
  /// refuse to queue work that depends on the Gateway.
  BOOTSTRAP_PHASE_FAILED = 4;
  /// Gateway is in graceful shutdown (SIGINT/SIGTERM received). The
  /// retained snapshot is cleared on exit; transient consumers will
  /// see `BOOTSTRAP_PHASE_UNSPECIFIED` once it disappears.
  BOOTSTRAP_PHASE_SHUTTING_DOWN = 5;
}

/// Single retained snapshot of Gateway bootstrap state.
///
/// Topic: acowork/global/bootstrap (QoS 1, retained).
///
/// OCP boundary — `protocol_version`, `instance_id`, `version`, `phase`,
/// `phase_detail`, and `issued_at_ms` are the ONLY fields on the wire.
/// The registry deliberately does NOT carry per-subsystem detail; the
/// Gateway exposes that through a separate, non-retained
/// `GET /api/bootstrap/subsystems` endpoint so that schema growth there
/// cannot break retained-snapshot consumers.
///
/// `version` is monotonically increasing per `instance_id`; a consumer
/// that sees the same `instance_id` with a lower `version` MUST treat
/// the older payload as stale. A consumer that sees a different
/// `instance_id` MUST treat the previous one as a different Gateway
/// (e.g. restart with retained-broker reset, second instance, etc.).
message BootstrapState {
  /// Protocol version of this BootstrapState envelope. Currently `1`.
  /// Bump on incompatible wire-format changes.
  uint32 protocol_version = 1;
  /// Stable identifier of the Gateway instance that emitted this
  /// snapshot (UUID v4 in lowercase hex). Generated fresh on every
  /// Gateway process start so a retained re-delivery from a previous
  /// instance is visibly distinct from a current one. Lets consumers
  /// distinguish a fresh Gateway from a retained re-delivery of a
  /// previous instance.
  string instance_id = 2;
  /// Monotonic counter, increments on every re-publish while the same
  /// `instance_id` is alive. Consumers use it for stale-snapshot
  /// detection.
  uint64 version = 3;
  /// Current lifecycle phase. See [`BootstrapPhase`].
  BootstrapPhase phase = 4;
  /// Free-form human-readable detail (e.g. "vault ready, 2/3 sidecars
  /// up, embedding warming up"). Always present; empty string when
  /// there is nothing to add. NOT for machine parsing.
  string phase_detail = 5;
  /// Wall-clock instant when this snapshot was emitted, in
  /// milliseconds since the Unix epoch. Consumers use it together with
  /// `version` to reject obviously stale retained re-deliveries.
  uint64 issued_at_ms = 6;
}

// ── ADR-059: Node control-plane readiness (Node → Gateway) ───────────────

/// Per-node control-plane readiness ack, published by a Node AFTER it
/// (a) successfully connects to the Gateway MQTT broker AND
/// (b) confirms every subscription it relies on for control-plane
/// traffic. Retained at QoS 1 on `acowork/nodes/{node_id}/ready`.
///
/// The Gateway re-marks `node.{id}` as ready in the
/// `SubsystemReadinessRegistry` on receipt. Until then, mutations
/// routed to that node fail with `dependency_not_ready`.
///
/// OCP boundary — only `node_id` and `protocol_version` are carried.
/// `control_gen` / generation counters belong on the per-command
/// envelope (`NodeControlCommand`), not here.
message NodeReady {
  /// Stable Node identifier (matches `NodeInfo.node_id`).
  string node_id = 1;
  /// Protocol version of the Node control plane (mirrors
  /// `NodeInfo.protocol_version`). Currently `1`.
  uint32 protocol_version = 2;
}
