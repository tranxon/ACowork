[package]
name = "acowork-mqtt-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

description = "Shared MQTT session lifecycle (ADR-039 Phase 2) - MqttSession, BootstrapAction, ErrClass, SessionState, reconnect policy"

[features]
default = []
# Enable From<&rumqttc::ConnectionError> for ErrorDescriptor.
# Runtime uses rumqttc 0.24, Desktop uses 0.25 – each consumer
# builds ErrorDescriptor manually from their own error type.
"rumqttc-0-25" = ["rumqttc"]

[dependencies]
async-trait = { workspace = true }
rumqttc = { version = "0.25", optional = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
